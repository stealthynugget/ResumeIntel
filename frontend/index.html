<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f2" />
    <title>Resume Intelligence</title>
    <script>
      (() => {
        let preference = 'system';
        try {
          const saved = localStorage.getItem('resumeintel-theme');
          if (saved === 'light' || saved === 'dark') preference = saved;
        } catch (_) { /* Theme still follows the OS when storage is unavailable. */ }
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#171f1d' : '#f4f6f2';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
